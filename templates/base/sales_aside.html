{% load static %}
{% block content %}
<style>
    /* Client Modal Styles */
    #clientModal .modal-dialog {
        max-width: 500px;
        margin: 1.75rem auto;
    }

    #clientModal .modal-content {
        border-radius: 16px;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    #clientModal .modal-body {
        padding: 2rem;
    }

    #clientModal .client {
        width: 100%;
    }

    #clientModal .input-group {
        margin-bottom: 1rem;
        width: 100%;
    }

    #clientModal .input-group-text {
        background-color: #f8f9fa;
        border: 1px solid #ced4da;
        border-right: none;
        padding: 0.75rem 1rem;
        min-width: 45px;
    }

    #clientModal .form-control {
        border: 1px solid #ced4da;
        border-left: none;
        padding: 0.75rem 1rem;
        font-size: 14px;
        height: auto;
        flex: 1;
    }

    #clientModal .form-control:focus {
        border-color: #11998e;
        box-shadow: 0 0 0 0.2rem rgba(17, 153, 142, 0.25);
    }

    #clientModal h5 {
        margin-bottom: 1.5rem;
        font-size: 1.25rem;
    }

    #clientModal .client-btn {
        margin-top: 1.5rem;
    }

    #clientModal .btn {
        padding: 0.75rem 2rem;
        font-weight: 500;
        border-radius: 8px;
        min-width: 140px;
    }

    #clientModal #id_client_error {
        text-align: center;
        margin: 1rem 0;
        font-size: 14px;
    }

    #clientModal .mb-2 {
        margin-bottom: 1rem !important;
    }

    #clientModal .mb-3 {
        margin-bottom: 1.5rem !important;
    }

    /* Media Queries for responsiveness */
    @media (max-width: 576px) {
        #clientModal .modal-dialog {
            margin: 10px;
            max-width: calc(100% - 20px);
        }

        #clientModal .modal-body {
            padding: 1.5rem;
        }

        #clientModal .btn {
            padding: 0.6rem 1.5rem;
            min-width: 120px;
        }

        #clientModal .input-group {
            flex-direction: column;
            align-items: flex-start;
        }

        #clientModal .input-group-text {
            width: 100%;
            text-align: left;
        }

        #clientModal .form-control {
            width: 100%;
            margin-top: 0.5rem;
        }
    }
</style>

<div class="client w-100">
    <h5 class="fw-bold text-center" style="color: teal;">Add new Customer</h5>
    <form class="mt-2" id="id_client_form" method="post">
        <div class="mb-2 input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input
                id="id_name"
                name="name"
                type="text"
                class="form-control"
                placeholder="Full name"
            />
        </div>

        <div class="mb-2 input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input
                name="email"
                type="text"
                class="form-control"
                id="id_email"
                placeholder="Email"
            />
        </div>

        <div class="mb-2 input-group">
            <span class="input-group-text"><i class="fas fa-phone"></i></span>
            <input
                type="text"
                name="phonenumber"
                class="form-control"
                placeholder="Phonenumber (+263......)"
                id="id_phonenumber"
            />
        </div>

        <div class="mb-2 input-group">
            <span class="input-group-text"><i class="fas fa-home"></i></span>
            <input
                name="address"
                type="text"
                class="form-control"
                id="id_address"
                placeholder="Address"
            />
        </div>

        <div class="mb-2 input-group">
            <span class="input-group-text"><i class="fas fa-id-card"></i></span>
            <input
                name="tin"
                type="text"
                class="form-control"
                id="id_tin"
                placeholder="TIN Number"
            />
        </div>

        <div class="mb-3 input-group">
            <span class="input-group-text"><i class="fas fa-percent"></i></span>
            <input
                name="vat"
                type="text"
                class="form-control"
                id="id_vat"
                placeholder="VAT"
            />
        </div>

        <p class="text-danger" id="id_client_error"></p>

        <div class="client-btn d-flex justify-content-center">
            <button class="btn btn-sm" style="background-color: teal; color: white;" type="button" onclick="submitClient();">
                Add Customer
            </button>
        </div>
    </form>
</div>

{% endblock content %}
