{% extends "base.html" %}
{% load static%}
{% load crispy_forms_tags %}
{% block title%} Edit Inventory {% endblock%}

{% block content %}
<style>
    .edit-inventory {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
    }

    .product-header {
        background: var(--primary-no-gradient);
        color: white;

        padding: 15px 25px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        margin-bottom: 24px;
        position: sticky;
        top: 20px;
        z-index: 1000;
    }

    .product-header .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .product-header .back-btn {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        text-decoration: none;
        margin-right: 16px;
    }

    .product-header .back-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateX(-4px);
    }

    .product-header h5 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.5px;
    }

    .product-header .logs-btn {
        background: white;
        color: var(--primary-no-gradient);
        border: none;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }

    .product-header .logs-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.4);
    }

    .form-container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
    }

    .form-grid .full-width {
        grid-column: 1 / -1;
    }

    .mb-3 {
        margin-bottom: 0 !important;
    }

    .form-label {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
        display: block;
    }

    .asteriskField {
        color: #ef4444;
        margin-left: 2px;
    }

    .form-control, .form-select {
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-size: 15px;
        transition: all 0.2s ease;
        width: 100%;
    }

    .form-control:focus, .form-select:focus {
        outline: none;
        background: white;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    textarea.form-control {
        min-height: 120px;
        resize: vertical;
    }

    .category-wrapper .d-flex {
        gap: 8px;
    }

    .category-wrapper .form-select {
        flex: 1;
    }

    #id_add_category {
        background: var(--primary-no-gradient);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        padding: 0;
    }

    #id_add_category:hover {
        background: #5568d3;
        transform: scale(1.05);
    }

    #id_add_category i {
        font-size: 20px;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 2px solid #f3f4f6;
    }

    .form-actions .btn {
        padding: 12px 32px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-danger {
        background: white;
        border: 2px solid #e5e7eb !important;
        color: #6b7280;
    }

    .btn-danger:hover {
        border-color: #ef4444 !important;
        color: #ef4444;
        background: #fef2f2;
    }

    .btn-secondary {
        background: var(--primary-no-gradient);
        color: white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-secondary:hover {
        background: #059669;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .text-danger {
        font-size: 13px;
        margin-top: 4px;
        display: block;
    }

    .modal-content {
        border-radius: 16px;
        border: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-body {
        padding: 32px;
    }

    .add-product-category-nav h6 {
        font-size: 20px;
        font-weight: 700;
        color: #1f2937;
        margin: 0;
    }

    .modal .form-control {
        margin-top: 8px;
    }

    .modal .btn {
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
    }

    .modal .btn i {
        margin-right: 4px;
    }
    /* Compact UI */
    .compact-ui {
    font-size: 0.875rem;
}

.compact-header {
    padding: 0.5rem 0;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid #dee2e6;
}

.compact-form .form-grid {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.compact-form .form-row {
    display: flex;
    gap: 0.75rem;
}

.compact-form .form-group {
    flex: 1;
    margin-bottom: 0;
}

.compact-form .form-group.full-width {
    flex: 1 0 100%;
}

.compact-form .form-label {
    font-size: 0.8rem;
    margin-bottom: 0.25rem;
    font-weight: 500;
}

.compact-form .form-control-sm,
.compact-form .form-select-sm {
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
}

.compact-form .btn-sm {
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
}

.compact-form .branches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.5rem;
}

.compact-form .form-check {
    margin-bottom: 0.25rem;
}

.compact-form .form-check-label {
    font-size: 0.8rem;
}

.compact-form .error-text {
    font-size: 0.7rem;
    margin-top: 0.125rem;
    margin-bottom: 0;
}

.compact-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 1rem;
    padding-top: 0.75rem;
    border-top: 1px solid #dee2e6;
}

@media (max-width: 768px) {
    .compact-form .form-row {
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .compact-form .branches-grid {
        grid-template-columns: 1fr;
    }
}

<div class="edit-inventory compact-ui">
    <div class="product-header compact-header">
        <div class="header-content d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <div class="hint--bottom" aria-label="products">
                    <a href="{% url 'inventory:inventory' %}" class="back-btn bx bx-left-arrow-alt"></a>
                </div>
                <h6 class="mb-0">EDIT: {{ product.name }}</h6>
            </div>
            <div>
                <a href="{% url 'inventory:inventory_detail' product.id %}" class="logs-btn btn-sm">Logs</a>
            </div>
        </div>
    </div>

    <div class="form-container compact-form">
        <form method="post">
            {% csrf_token %}
            <div class="form-grid compact-grid">
                <!-- Row 1: Name and Category -->
                <div class="form-row">
                    <div class="form-group compact-group">
                        <label for="id_name" class="form-label requiredField">
                            Name<span class="asteriskField">*</span>
                        </label>
                        <input 
                            type="text" 
                            name="name" 
                            value='{{product.name}}'
                            class="textinput form-control form-control-sm" 
                            required id="id_name"
                        >
                    </div>

                    <div class="form-group compact-group">
                        <label for="id_category" class="form-label requiredField">
                            Category<span class="asteriskField">*</span>
                        </label>
                        <div class='d-flex align-items-center'>
                            <select name="category" class="select form-select form-select-sm" value="{{product.category}}" required id="id_category">
                                {% for category in categories %}
                                    <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                            <button class='btn btn-sm btn-outline-secondary ms-1' type="button" id='id_add_category' title="Add Category">
                                <i class='bx bx-plus'></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Row 2: Cost, Price, and Wholesale Price -->
                <div class="form-row">
                    <div class="form-group compact-group">
                        <label for="id_cost" class="form-label requiredField">
                            Cost<span class="asteriskField">*</span>
                        </label>
                        <input type="number" name="cost" value={{product.cost}} step="0.01" class="numberinput form-control form-control-sm" required id="id_cost">
                        <p id="cost_error" class="error-text"></p>
                    </div>

                    <div class="form-group compact-group">
                        <label for="id_price" class="form-label requiredField">
                            Price<span class="asteriskField">*</span>
                        </label>
                        <input type="number" name="price" value={{product.price}} step="0.01" class="numberinput form-control form-control-sm" required id="id_price">
                        <p id="price_error" class="error-text"></p>
                    </div>

                    <div class="form-group compact-group">
                        <label for="id_dealer_price" class="form-label requiredField">
                            Wholesale<span class="asteriskField">*</span>
                        </label>
                        <input type="number" name="dealer_price" value={{product.dealer_price}} step="0.01" class="numberinput form-control form-control-sm" required id="id_dealer_price">
                        <p id="wholesale_error" class="error-text"></p>
                    </div>
                </div>

                <!-- Row 3: Quantity and Min Stock -->
                <div class="form-row">
                    <div class="form-group compact-group">
                        <label for="id_quantity" class="form-label requiredField">
                            Qty<span class="asteriskField">*</span>
                        </label>
                        <input type="number" name="quantity" value={{product.quantity}} class="numberinput form-control form-control-sm" required id="id_quantity">
                        <p id="quantity_error" class="error-text"></p>
                    </div>

                    <div class="form-group compact-group">
                        <label for="id_min_stock_level" class="form-label requiredField">
                            Min Stock<span class="asteriskField">*</span>
                        </label>
                        <input 
                            type="number" 
                            name="min_stock_level" 
                            value="{{ product.stock_level_threshold }}" 
                            class="numberinput form-control form-control-sm" 
                            required id="id_min_stock_level"
                        >
                    </div>
                </div>

                <!-- Row 4: Available Branches -->
                <div class="form-group compact-group full-width">
                    <label class="form-label fw-bold">Available in</label>
                    <div class="branches-grid">
                        {% for branch in branches %}
                        <div class="form-check form-check-inline">
                            <input type="checkbox" name="{{branch.name}}" class="checkboxinput form-check-input" id="{{branch.id}}">
                            <label for="{{branch.name}}" class="form-check-label">
                                {{ branch.name }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- Row 5: Description -->
                <div class="form-group compact-group full-width">
                    <label for="id_description" class="form-label">
                        Description<span class="asteriskField">*</span>
                    </label>
                    <textarea 
                        name="description" 
                        cols="20" 
                        rows="2" 
                        class="form-control form-control-sm" 
                        value="{{product.description}}"
                    >{{ product.description }}</textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions compact-actions">
                <button type="reset" class="btn btn-sm btn-outline-secondary">Reset</button>
                <button type="submit" class="btn btn-sm btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>


<!-- category modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="loaderModalLabel" aria-hidden="true" data-backdrop="static" data-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <div class="category">
                    <div class='add-product-category' id="id_category_form">
                        <div class='add-product-category-nav d-flex mt-2 py-3 px-2 align-items-center'>
                            <div>
                                <h6 class='mt-2 fw-bold'>Add Category</h6>
                            </div>
                        </div>
                        <form method='post' class='px-2'>
                            {% csrf_token %}
                            <div class='mb-2'>
                                <label for='id_name'>Category Name</label>
                                <input 
                                    name='name' 
                                    id='id_category_name' 
                                    type='text' 
                                    class='form-control'
                                />
                            </div>
                            <small id='id_error'></small>
                            <div class="d-flex justify-content-end">
                                <div class="">
                                    <button type="reset" class="btn btn-danger btn-sm w-100">
                                        <i class='bx bx-reset'></i>
                                        reset
                                    </button>
                                </div>
                                <span class="px-1"></span>
                                <div class="">
                                    <button type="button" onclick="categorySubmit();" class="btn btn-secondary btn-sm w-100">
                                        <i class='bx bx-save'></i>
                                        save
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div> 
            </div>
        </div>
    </div>
</div>

<script>
    const categoryModal = new bootstrap.Modal(document.querySelector('#categoryModal'));
    
    document.querySelector('#id_add_category').addEventListener(
        'click', ()=>{
            categoryModal.show()
        }
    ) 

     function categorySubmit(){
        
        const data = {name:$('#id_category_name').val()}
          
        fetch("{% url 'inventory:add_product_category' %}", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken"), 
            },
            body: JSON.stringify(data),
          })
            .then(response => response.json())
            .then((response) => {
              if (response.success) {
                Swal.fire({
                  title: 'success',
                  text: 'Category successfully saved.',
                  icon:'success',
                  timer: 2000,
                  showConfirmButton: false
                })
                fetchCategories()
                categoryModal.hide()
                supplierFormModal.show()
              } else {
                Swal.fire({
                  title:'warning',
                  text:response.message,
                  icon:'warning',
                })
              }
            })
            .catch((error) => {
              console.log(error)
            });
          }
  
        async function fetchCategories(){
            try {
                const response = await fetch('{% url "inventory:add_product_category" %}');
    
                if (!response.ok) {
                    throw new Error('Network response was not ok.');
                }
                const data = await response.json();
                updateCategory(data);
            } catch (error) {
                console.error('Error fetching categories:', error);
            } 
        }
  
        fetchCategories()
  
        function updateCategory(data){
            const catElement = document.querySelector('#id_category')
        
            while(catElement.options.length > 1){
                catElement.remove(1)
            }
            data.forEach((category)=>{
                if({{ product.category.id }}  === category.id ){
                    catElement.innerHTML += `<option selected value=${category.id}>${category.name}</option>`
                }else{
                    catElement.innerHTML += `<option value=${category.id}>${category.name}</option>`
                }
                
            })
        }
</script>
{% endblock content %}
