<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCategory" aria-labelledby="offcanvasCategoryLabel1">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasCategoryLabel1">Categories</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="incomeCat">
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-success flex-fill">Income</button>
                <button class="btn btn-outline-secondary flex-fill">Expense</button>
            </div>
            
            <div class="mb-4">
                <h6 class="mb-3"><i class="bi bi-currency-dollar"></i> Salary</h6>
                <div class="d-flex gap-2 mb-3">
                    <span class="badge bg-light text-dark px-3 py-2">Monthly</span>
                    <span class="badge bg-light text-dark px-3 py-2">Bonus</span>
                    <span class="badge bg-light text-dark px-3 py-2">Freelance</span>
                </div>
            </div>

            <div class="mb-4">
                <h6 class="mb-3"><i class="bi bi-graph-up"></i> Investment</h6>
                <div class="d-flex gap-2 mb-3">
                    <span class="badge bg-light text-dark px-3 py-2">Stocks</span>
                    <span class="badge bg-light text-dark px-3 py-2">Real Estate</span>
                    <span class="badge bg-light text-dark px-3 py-2">Dividends</span>
                </div>
            </div>
        </div>
           
        <div class="expenseCat">
            <div class="mb-4">
                <h6 class="mb-3"><i class="bi bi-house"></i> Housing</h6>
                <div class="d-flex gap-2 mb-3">
                    <span class="badge bg-light text-dark px-3 py-2">Rent</span>
                    <span class="badge bg-light text-dark px-3 py-2">Utilities</span>
                    <span class="badge bg-light text-dark px-3 py-2">Maintenance</span>
                </div>
            </div>

            <div class="mb-4">
                <h6 class="mb-3"><i class="bi bi-car-front"></i> Transportation</h6>
                <div class="d-flex gap-2 mb-3">
                    <span class="badge bg-light text-dark px-3 py-2">Fuel</span>
                    <span class="badge bg-light text-dark px-3 py-2">Insurance</span>
                    <span class="badge bg-light text-dark px-3 py-2">Maintenance</span>
                </div>
            </div>
        </div>

            <button class="btn btn-outline-primary w-100">
                <i class="bi bi-plus-circle"></i> Add New Category
            </button>
    </div>
</div>
