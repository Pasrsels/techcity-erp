<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasExpense" aria-labelledby="offcanvasExpenseLabel">
  <div class="offcanvas-header">
    <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <div class="offcanvas-body">
    <form id="expenseForm">
          <div class="p-2 pb-0">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <div class="dropdown">
          <button class="btn btn-link text-danger p-0 dropdown-toggle text-decoration-none" type="button" data-bs-toggle="dropdown">
            CASH
          </button>
          <ul class="dropdown-menu text-danger">
            <li><a class="dropdown-item" href="#">CASH</a></li>
            <li><a class="dropdown-item" href="#">BANK</a></li>
            <li><a class="dropdown-item" href="#">ECOCASH</a></li>
          </ul>
        </div>

        <div class="dropdown">
          <button class="btn btn-link text-danger p-0 dropdown-toggle text-decoration-none" type="button" data-bs-toggle="dropdown">
            USD
          </button>
          <ul class="dropdown-menu text-danger">
            <li><a class="dropdown-item" href="#">USD</a></li>
            <li><a class="dropdown-item" href="#">ZWG</a></li>
            <li><a class="dropdown-item" href="#">RAND</a></li>
          </ul>
        </div>
      </div>

      <input id="amountInputExpense"
        type="number"
        inputmode="decimal"
        class="amount-text text-center" 
        style="width: 280px;"
        placeholder="0.00"
      />
    
      
      <div class="mb-3">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0" style="border-radius: 25px 0 0 25px; border-right: none;">
            <i class="bx bx-text"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0" placeholder="Title" style="border-radius: 0 25px 25px 0;">
        </div>
      </div>

      <div class="mb-3">
        <div class="dropdown w-100">
          <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" data-bs-toggle="dropdown" style="border-radius: 25px; border-color: #e9ecef; padding: 15px 20px;">
            Select or add category
          </button>
          <ul class="dropdown-menu w-100">
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#"><i class="bx bx-plus"></i> Add new category</a></li>
          </ul>
        </div>
      </div>

      <div class="mb-3">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0" style="border-radius: 25px 0 0 25px;">
            <i class="bx bx-file-blank"></i>
          </span>
          <textarea class="form-control border-start-0 ps-0" placeholder="Description" rows="3" style="border-radius: 0 25px 25px 0;"></textarea>
        </div>
      </div>

      <div class="mb-3">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0" style="border-radius: 25px 0 0 25px;">
            <i class="bx bx-user"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0" placeholder="" style="border-radius: 0 25px 25px 0;">
        </div>
      </div>

      <div class="mb-3">
        <div class="dropdown w-100">
          <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start d-flex align-items-center" type="button" data-bs-toggle="dropdown" style="border-radius: 25px; border-color: #e9ecef; padding: 15px 20px;">
            <i class="bx bx-map-pin me-2"></i>
            Branch
          </button>
          <ul class="dropdown-menu w-100">
            <li><a class="dropdown-item" href="#">HARARE</a></li>
            <li><a class="dropdown-item" href="#">PC PASELS</a></li>
            <li><a class="dropdown-item" href="#">MUTARE</a></li>
          </ul>
        </div>
      </div>

      <div id="attachment-Area" class="attachment-area">
        <i class="bx bx-paperclip text-muted" style="font-size: 1.5rem;"></i>
        <p class="text-muted mb-0 mt-2">Drag & drop files or click to browse</p>
        <input type="file" class="d-none" id="fileInputExpense" multiple>
      </div>

      <div class="option-links justify-content-between d-flex mb-4 flex-wrap gap-2">
        <a class="loan" href="#">Loan?</a>
        <a class="recExp" href="#">Recurring Expense?</a>
        <a class="expRem" href="#">Set a Reminder?</a>
      </div>

      <button type="submit" class="btn-record-expense">
        Record Expense
      </button>
    </form>
  </div>
</div>
