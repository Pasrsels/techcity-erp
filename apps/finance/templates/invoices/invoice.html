{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
:root {
    --primary: #11998e;
    --primary-no-gradient: #11998e;
    --primary-dark: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
    --secondary: orange;
    --accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --success: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    --warning: linear-gradient(135deg, #fce38a 0%, #f38181 100%);
    --danger: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    --dark: #1a1a2e;
    --dark-alt: #16213e;
    --text-light: rgba(228, 230, 234, 1);
    --text-dark: black;
    --text-muted: black;
    --glass: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.2);
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 8px 6px rgba(0, 0, 0, 0.12);
    --border-radius: 16px;
    --border-radius-sm: 8px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.financ {
    background: white;
    min-height: 100vh;
}

.header {
    padding: 20px 30px;
    border-bottom: 1px solid #e9ecef;
    background: white;
    position: sticky;
    top: 0;
    z-index: 100;
}

.search-container {
    padding: 15px 30px;
    background: white;
    position: sticky;
    top: 80px;
    z-index: 99;
    border-bottom: 1px solid #e9ecef;
}

.search-input {
    width: 100%;
    padding: 12px 20px;
    border-radius: var(--border-radius-sm);
    border: 1px solid #ddd;
    font-size: 15px;
    transition: var(--transition);
}

.search-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1);
}

.invoice-section {
    margin: 20px 30px;
}

.section-header {
    padding: 15px 20px;
    background: #f8f9fa;
    border-radius: var(--border-radius-sm) var(--border-radius-sm) 0 0;
    border: 1px solid #e9ecef;
    border-bottom: none;
}

.section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 5px;
}

.section-summary {
    display: flex;
    gap: 20px;
    font-size: 0.9rem;
    color: #6c757d;
}

.invoice-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border: 1px solid #e9ecef;
    border-top: none;
}

.invoice-table thead {
    background: var(--primary);
    color: white;
}

.invoice-table th {
    padding: 12px;
    text-align: left;
    font-weight: 600;
    font-size: 0.9rem;
}

.invoice-table td {
    padding: 12px;
    border-bottom: 1px solid #e9ecef;
    font-size: 0.9rem;
}

.invoice-table tbody tr:hover {
    background: #f8f9fa;
}

.customer-link {
    color: #3498db;
    text-decoration: none;
}

.customer-link:hover {
    text-decoration: underline;
}

.text-success {
    color: #28a745;
}

.text-danger {
    color: #dc3545;
}

.action-icons {
    display: flex;
    gap: 10px;
    align-items: center;
}

.action-icon {
    cursor: pointer;
    padding: 5px;
    transition: var(--transition);
}

.action-icon:hover {
    transform: scale(1.2);
}

.loading-container {
    text-align: center;
    padding: 40px;
}

.spinner {
    border: 3px solid #f3f3f3;
    border-top: 3px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.no-more-data {
    text-align: center;
    padding: 20px;
    color: #6c757d;
    font-style: italic;
}

.btn {
    padding: 8px 16px;
    border-radius: var(--border-radius-sm);
    border: none;
    cursor: pointer;
    transition: var(--transition);
    font-size: 14px;
}

.btn-outline-dark {
    background: white;
    border: 1px solid #333;
    color: #333;
}

.btn-outline-dark:hover {
    background: #333;
    color: white;
}

.form-select {
    padding: 8px 12px;
    border-radius: var(--border-radius-sm);
    border: 1px solid #ddd;
}

.form-control {
    padding: 8px 12px;
    border-radius: var(--border-radius-sm);
    border: 1px solid #ddd;
}

@media (max-width: 768px) {
    .invoice-table {
        font-size: 0.8rem;
    }
    
    .invoice-table th,
    .invoice-table td {
        padding: 8px;
    }
    
    .section-summary {
        flex-direction: column;
        gap: 5px;
    }
}
</style>

<script>
class InvoiceManager {
    constructor() {
        this.currentPage = 1;
        this.isLoading = false;
        this.hasMore = true;
        this.allInvoices = [];
        this.searchTimeout = null;
        this.init();
    }

    init() {
        this.loadInvoices();
        this.setupInfiniteScroll();
        this.setupSearch();
    }

    async loadInvoices() {
        if (this.isLoading || !this.hasMore) return;
        
        this.isLoading = true;
        this.showLoading();
        
        try {
            const response = await fetch(`/finance/invoice_json/?page=${this.currentPage}&json=true`, {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                this.allInvoices = [...this.allInvoices, ...data.invoices];
                this.hasMore = data.pagination.has_next;
                this.currentPage++;
                this.render();
            }
        } catch (error) {
            console.error('Error loading invoices:', error);
            this.showError();
        } finally {
            this.isLoading = false;
        }
    }

    groupInvoicesByDate(invoices) {
        const grouped = {};
        
        invoices.forEach(invoice => {
            const date = new Date(invoice.date);
            const dateKey = date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });
            
            if (!grouped[dateKey]) {
                grouped[dateKey] = {
                    invoices: [],
                    totalAmount: 0,
                    totalDue: 0
                };
            }
            
            grouped[dateKey].invoices.push(invoice);
            grouped[dateKey].totalAmount += parseFloat(invoice.total);
            grouped[dateKey].totalDue += parseFloat(invoice.balance);
        });
        
        return grouped;
    }

    render() {
        const content = document.getElementById('invoiceContent');
        
        if (this.allInvoices.length === 0 && !this.isLoading) {
            content.innerHTML = '<div class="no-more-data">No invoices found</div>';
            return;
        }

        const grouped = this.groupInvoicesByDate(this.allInvoices);
        const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

        let html = '';
        sortedDates.forEach(date => {
            const data = grouped[date];
            html += this.renderSection(date, data);
        });

        content.innerHTML = html;

        if (this.hasMore) {
            content.innerHTML += `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p>Loading more invoices...</p>
                </div>
            `;
        } else if (this.allInvoices.length > 0) {
            content.innerHTML += '<div class="no-more-data">No more invoices to load</div>';
        }

        this.attachEventListeners();
    }

    renderSection(dateHeading, data) {
        console.log(data);
        return `
            <div class="invoice-section">
                <div class="section-header">
                    <div class="section-title">${dateHeading}</div>
                    <div class="section-summary">
                        <span>${data.invoices.length} invoice${data.invoices.length !== 1 ? 's' : ''}</span>
                        <span>Total: USD ${data.totalAmount.toFixed(2)}</span>
                        <span>Due: USD ${data.totalDue.toFixed(2)}</span>
                    </div>
                </div>
                <table class="invoice-table">
                    <thead>
                        <tr>
                            <th>Reference</th>
                            <th>Customer Name</th>
                            <th>Products</th>
                            <th>Grand Total</th>
                            <th>Paid</th>
                            <th>Due</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${data.invoices.map(inv => this.renderInvoiceRow(inv)).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    renderInvoiceRow(invoice) {
        const time = new Date(invoice.date).toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: false
        });
        const date = new Date(invoice.date).toLocaleDateString('en-GB');

        const dueClass = parseFloat(invoice.balance) > 0 ? 'text-danger' : 'text-success';

        return `
            <tr>
                <td>
                    <small>
                        <i class="bx bx-file"></i> #${invoice.invoice_number}
                        <br>
                        <i class="bx bx-time"></i> ${date} ${time}
                    </small>
                </td>
                <td>
                    <small>
                        <a href="/finance/customer/${invoice.customer_id}/" class="customer-link">
                            ${invoice.customer_name}
                        </a>
                    </small>
                </td>
                <td>
                    <small>
                        ${invoice.invoice_items.map(item => item.item__name + ' x ' + item.quantity).join(', ')}
                    </small>
                </td>
                <td><small>USD ${parseFloat(invoice.total).toFixed(2)}</small></td>
                <td><small>USD ${parseFloat(invoice.paid).toFixed(2)}</small></td>
                <td>
                    <small class="${dueClass}">
                        USD ${parseFloat(invoice.balance).toFixed(2)}
                    </small>
                </td>
                <td>
                    <div class="action-icons">
                        <span class="action-icon" data-action="preview" data-id="${invoice.id}" title="Preview Invoice">
                            <i class='bx bx-file'></i>
                        </span>
                        ${parseFloat(invoice.balance) > 0 ? `
                            <span class="action-icon" data-action="payment" data-id="${invoice.id}" data-amount="${invoice.balance}" title="Make Payment">
                                <i class='bx bx-right-arrow'></i>
                            </span>
                        ` : ''}
                        <span class="action-icon" data-action="credit-note" data-id="${invoice.id}" title="Issue Credit Note">
                            <i class='bx bx-credit-card'></i>
                        </span>
                    </div>
                </td>
            </tr>
        `;
    }

    attachEventListeners() {
        document.querySelectorAll('[data-action="preview"]').forEach(el => {
            el.addEventListener('click', () => {
                const invoiceId = el.dataset.id;
                fetchInvoicePreview(invoiceId);
            });
        });

        document.querySelectorAll('[data-action="payment"]').forEach(el => {
            el.addEventListener('click', () => {
                invoiceId = el.dataset.id;
                invoiceAmountDue = el.dataset.amount;
                updateModal.show();
            });
        });

        document.querySelectorAll('[data-action="credit-note"]').forEach(el => {
            el.addEventListener('click', () => {
                currentInvoiceId = el.dataset.id;
                fetchInvoiceItems(currentInvoiceId);
            });
        });
    }

    showLoading() {
        const content = document.getElementById('invoiceContent');
        if (this.currentPage === 1) {
            content.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <p>Loading invoices...</p>
                </div>
            `;
        }
    }

    showError() {
        const content = document.getElementById('invoiceContent');
        content.innerHTML = `
            <div class="no-more-data">
                <p>Failed to load invoices. Please try again.</p>
                <button class="btn btn-outline-dark" onclick="location.reload()">Retry</button>
            </div>
        `;
    }

    setupInfiniteScroll() {
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
                this.loadInvoices();
            }
        });
    }

    setupSearch() {
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(this.searchTimeout);
            this.searchTimeout = setTimeout(() => {
                this.handleSearch(e.target.value);
            }, 300);
        });
    }

    handleSearch(query) {
        const searchTerm = query.toLowerCase();
        const filtered = this.allInvoices.filter(invoice => {
            return invoice.customer_name.toLowerCase().includes(searchTerm) ||
                   invoice.invoice_number.toString().includes(searchTerm) ||
                   invoice.total.toString().includes(searchTerm) ||
                   invoice.invoice_items.map(item => item.item__name).join(', ').toLowerCase().includes(searchTerm);
        });

        const grouped = this.groupInvoicesByDate(filtered);
        const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

        const content = document.getElementById('invoiceContent');
        if (filtered.length === 0) {
            content.innerHTML = '<div class="no-more-data">No invoices found matching your search</div>';
            return;
        }

        let html = '';
        sortedDates.forEach(date => {
            const data = grouped[date];
            html += this.renderSection(date, data);
        });

        content.innerHTML = html;
        this.attachEventListeners();
    }
}

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function updateTotals() {
        let subtotal = 0;
        let vat = 0;
        
        document.querySelectorAll('#creditNoteItems tr').forEach(row => {
            const qtyInput = row.querySelector('.credit-qty');
            const discountInput = row.querySelector('.discount-amount');
            const returnCheckbox = row.querySelector('.return-item');
            const unitPrice = parseFloat(qtyInput.dataset.unitPrice);
            const vatRate = parseFloat(qtyInput.dataset.vatRate);
            const quantity = parseInt(qtyInput.value) || 0;
            const discount = parseFloat(discountInput.value) || 0;
            const isReturn = returnCheckbox.checked;
            
            if (quantity > 0) {
                let itemTotal = quantity * unitPrice;
                
                if (!isReturn && discount > 0) {
                    itemTotal = itemTotal - discount;
                }
                
                if (isReturn) {
                    const vatAmount = itemTotal * (vatRate / 100);
                    vat += vatAmount;
                }
                
                subtotal += itemTotal;
                row.querySelector('.item-total').textContent = itemTotal.toFixed(2);
            } else {
                row.querySelector('.item-total').textContent = '0.00';
            }
        });
        
        document.getElementById('creditNoteSubtotal').textContent = subtotal.toFixed(2);
        document.getElementById('creditNoteVAT').textContent = vat.toFixed(2);
        document.getElementById('creditNoteTotal').textContent = (subtotal + vat).toFixed(2);
    }

    // Function to print the receipt silently
    function printReceiptSilently(content) {
        let printFrame = document.getElementById("print-frame");

        if (!printFrame) {
            printFrame = document.createElement("iframe");
            printFrame.id = "print-frame";
            printFrame.style.position = "absolute";
            printFrame.style.width = "0px";
            printFrame.style.height = "0px";
            printFrame.style.border = "none";
            printFrame.style.visibility = "hidden";
            document.body.appendChild(printFrame);
        }

        const frameDoc = printFrame.contentWindow || 
                        printFrame.contentDocument.document || 
                        printFrame.contentDocument;

        frameDoc.document.open();
        frameDoc.document.write(`
            <html>
            <head>
                <title>Print Receipt</title>
                <style>
                    body { font-family: Arial, sans-serif; font-size: 12px; }
                </style>
            </head>
            <body onload="window.print(); setTimeout(() => window.close(), 1000);">
                ${content}
            </body>
            </html>
        `);
        frameDoc.document.close();

        }
